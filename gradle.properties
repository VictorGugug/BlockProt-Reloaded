blockProtVersion=1.3.4
org.gradle.jvmargs=--enable-native-access=ALL-UNNAMED
versionSuffix=hotfix
nbtApiVersion=2.15.7
townyVersion=0.100.4.0
papiVersion=2.12.2
worldGuardVersion=7.0.17
# targetJavaVersion no longer controls the toolchain (fixed to JDK 25 / bytecode 21 in build.gradle.kts)
targetJavaVersion=21
org.gradle.java.installations.auto-download=true

# versionSuffix -- appended to blockProtVersion with a dash.
# Leave blank for a clean stable release  ->  BlockProtReloaded-1.3.4.jar
# Set both blockProtVersion and versionSuffix manually. There is no
# auto-increment; each build uses exactly what is written here.
# The published GitHub release tag always equals this full version
# (e.g. tag "1.3.4-hotfix"). Clean releases are just "1.3.4" -- no
# "-RELEASE" word is ever appended (older tags like "1.3.3-RELEASE"
# are legacy and are normalized to plain releases by the plugin).
#
# Recognized suffix kinds, and how the plugin's update checker
# reports them in-game (see docs/ZYZ for the matching logic in
# SemanticVersion / UpdateChecker):
#
#   (blank)        -> 1.3.4             Clean stable release. Update message:
#                                       "BlockProt is outdated" (normal).
#   dev            -> 1.3.4-dev         Active development build (pre-release).
#   BDev           -> 1.3.4-BDev        Beta/dev build (pre-release; used for
#                                       beta-publishing on marketplaces).
#   SNAPSHOT       -> 1.3.4-SNAPSHOT    Legacy alias of dev (pre-release).
#   alpha.N        -> 1.3.4-alpha.1     Pre-release stage (pre-release).
#   beta.N         -> 1.3.4-beta.1      Pre-release stage (pre-release).
#   rc.N           -> 1.3.4-rc.1        Release candidate (pre-release).
#   hotfix[.N]     -> 1.3.4-hotfix      Critical bug-fix of the current
#                                       release. Ranked ABOVE the clean
#                                       release: users on 1.3.4 are told
#                                       "important hotfix available" and
#                                       pointed to that release's tag page.
#   fix[.N]        -> 1.3.4-fix.1       Targeted bugfix, same as hotfix.
#   patch[.N]      -> 1.3.4-patch.1     Same as hotfix.
#   exp            -> experimental branch builds; never shown as an update.
