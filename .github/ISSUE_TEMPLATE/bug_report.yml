name: Bug Report
description: Create a bug report to help improve the plugin
title: '[Bug]: '
labels: [triage]
body:
    - type: input
      id: discord
      attributes:
          label: Discord Username (Optional)
          description: Your Discord tag so I can identify you and give you credit.
          placeholder: e.g. vicplaying
    - type: input
      id: version
      attributes:
          label: Server Version
          description: Exact server software and version (Paper, Purpur, Spigot, etc.).
          placeholder: e.g. 26.2 Paper
      validations:
          required: true
    - type: input
      id: plugin_version
      attributes:
          label: Plugin Version
          description: The version of BlockProt Reloaded where the bug occurs.
          placeholder: e.g. 1.3.3
      validations:
          required: true
    - type: input
      id: client_version
      attributes:
          label: Client Version (Optional)
          description: Your Minecraft client version, if relevant.
    - type: textarea
      id: actual
      attributes:
          label: Bug Description
          description: What the bug is and what is happening in detail. Attach screenshots or videos if the bug is visual.
      validations:
          required: true
    - type: textarea
      id: reproduce
      attributes:
          label: Steps to Reproduce
          description: List the exact steps to make the bug happen again.
          placeholder: |
              1. Place a chest
              2. Lock it with /bp
              3. Open it with a friend
              4. See error
      validations:
          required: true
    - type: textarea
      id: logs
      attributes:
          label: Error Logs
          description: Paste the error from console or logs folder. Use a paste site (pastes.dev / mclo.gs) if it is long.
          placeholder: Paste error log here...
    - type: textarea
      id: additional_context
      attributes:
          label: Additional Context
          description: Add any other context about the problem here.
