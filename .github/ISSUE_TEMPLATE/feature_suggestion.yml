name: Feature Suggestion
description: Write a feature suggestion that you would like to see in a future version of the plugin
title: '[Feature]: '
labels: [enhancement]
assignees: VictorGugug
body:
    - type: input
      id: discord
      attributes:
          label: Discord Username (Optional)
          description: Your Discord tag so I can identify you and give you credit.
          placeholder: e.g. vicplaying
    - type: dropdown
      id: edition
      attributes:
          label: Edition
          description: The BlockProt edition you are using. If unsure, read docs/READ_MEs/VERSION_GUIDE.md in the repository.
          options:
              - BlockProt Reloaded
              - BlockProt Reloaded Legacy
              - BlockProt Legacy
      validations:
          required: true
    - type: textarea
      id: feature_description
      attributes:
          label: Feature Description
          description: Describe your feature idea. Be as clear and concise as possible about why you want this and what problem it solves. You can attach images or sketches to further illustrate your idea.
      validations:
          required: true
    - type: textarea
      id: additional_context
      attributes:
          label: Additional Context
          description: Add any other context about the feature here.
