name: Publish Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. 1.3.6)"
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build JAR
    runs-on: ubuntu-latest
    outputs:
      jar_path: ${{ steps.jar.outputs.path }}
      version:  ${{ steps.jar.outputs.version }}
      channel:  ${{ steps.jar.outputs.channel }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build shadow JAR
        run: ./gradlew :blockprot-spigot:shadowJar --no-daemon

      - name: Locate JAR and resolve metadata
        id: jar
        run: |
          JAR=$(find spigot/build/libs -name "BlockProtReloaded-*.jar" \
                ! -name "*-javadoc*" ! -name "*-sources*" | head -1)
          VERSION=$(basename "$JAR" .jar | sed 's/^BlockProtReloaded-//')

          if echo "$VERSION" | grep -qiE 'snapshot|alpha|dev|nightly|wip|bedev'; then
            CHANNEL="alpha"
          elif echo "$VERSION" | grep -qiE 'beta|rc'; then
            CHANNEL="beta"
          else
            CHANNEL="release"
          fi

          FILE_SIZE=$(ls -lh "$JAR" | awk '{print $5}')

          echo "path=$JAR"       >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "size=$FILE_SIZE"  >> "$GITHUB_OUTPUT"
          echo "Built: $JAR (version=$VERSION, channel=$CHANNEL, size=$FILE_SIZE)"

      - name: Publish step summary
        run: |
          cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ## BlockProt Reloaded Release Published

          | Metric | Details |
          | :--- | :--- |
          | **Version** | \`${{ steps.jar.outputs.version }}\` |
          | **Channel** | \`${{ steps.jar.outputs.channel }}\` |
          | **Artifact Path** | \`${{ steps.jar.outputs.path }}\` |
          | **Artifact Size** | \`${{ steps.jar.outputs.size }}\` |
          | **Event** | \`${{ github.event_name }}\` |
          EOF
