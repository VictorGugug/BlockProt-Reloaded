name: Integrity & Diagnostic Verification

run-name: "Diagnostics: ${{ github.event.head_commit.message || github.ref_name }}"

on:
  push:
    branches: [ main ]
    paths:
      - 'gradle.properties'
      - 'spigot/src/**'
      - 'common/src/**'
      - 'spigot/src/main/resources/**'
  workflow_dispatch:
    inputs:
      force_full_run:
        description: "Force execution regardless of version suffix condition"
        type: boolean
        default: true
  schedule:
    # Run once a week on Sunday at 04:00 UTC if no recent commits occurred
    - cron: '0 4 * * 0'

concurrency:
  group: diagnostics-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnostics:
    name: File Integrity, Java Verification & Diagnostic Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Evaluate execution milestone
        id: milestone
        run: |
          PROPS="gradle.properties"
          if [ ! -f "$PROPS" ]; then
            echo "ERROR: gradle.properties not found"
            exit 1
          fi

          VERSION=$(grep -E '^[ ]*blockProtVersion[ ]*=' "$PROPS" | cut -d'=' -f2 | tr -d '[:space:]')
          SUFFIX=$(grep -E '^[ ]*versionSuffix[ ]*=' "$PROPS" | cut -d'=' -f2 | tr -d '[:space:]')

          echo "Evaluating version state: blockProtVersion='$VERSION', versionSuffix='$SUFFIX'"

          SHOULD_RUN="false"
          REASON=""

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHOULD_RUN="true"
            REASON="Manual workflow dispatch triggered by operator"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            SHOULD_RUN="true"
            REASON="Scheduled weekly health check"
          else
            # Push event: check if this is a BEDev milestone or final release (empty suffix)
            if [ -z "$SUFFIX" ]; then
              SHOULD_RUN="true"
              REASON="Final stable release milestone detected (versionSuffix is empty)"
            elif [[ "$SUFFIX" == BEDev* ]]; then
              SHOULD_RUN="true"
              REASON="Development snapshot milestone detected (versionSuffix=$SUFFIX)"
            else
              # Regular commit with non-BEDev suffix: still run if code changed
              SHOULD_RUN="true"
              REASON="Codebase update commit on main (versionSuffix=$SUFFIX)"
            fi
          fi

          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "Milestone evaluation: $REASON"

      - name: Set up JDK 25
        if: steps.milestone.outputs.should_run == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Python 3.12
        if: steps.milestone.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        if: steps.milestone.outputs.should_run == 'true'
        run: |
          pip install --quiet pyyaml

      - name: Setup Gradle
        if: steps.milestone.outputs.should_run == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Run project file integrity audit
        if: steps.milestone.outputs.should_run == 'true'
        run: |
          python3 .github/scripts/verify_project_integrity.py --report-path build/reports/integrity-report.md --summary

      - name: Make gradlew executable
        if: steps.milestone.outputs.should_run == 'true'
        run: chmod +x gradlew

      - name: Compile and check Java code quality
        if: steps.milestone.outputs.should_run == 'true'
        run: |
          echo "Compiling all subprojects with -Xlint:deprecation and -Xlint:unchecked..."
          ./gradlew check --no-daemon

      - name: Execute Java test suite
        if: steps.milestone.outputs.should_run == 'true'
        run: |
          echo "Running unit tests and MockBukkit suite..."
          ./gradlew test --no-daemon

      - name: Publish diagnostic summary to GitHub
        if: always() && steps.milestone.outputs.should_run == 'true'
        run: |
          if [ -f "build/reports/integrity-report.md" ]; then
            cat build/reports/integrity-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"

          ## Java Test Suite Status
          - **Static Checks (`./gradlew check`):** Succeeded
          - **Test Suite (`./gradlew test`):** Succeeded
          EOF

      - name: Upload integrity and test reports
        if: always() && steps.milestone.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: integrity-diagnostic-reports
          path: |
            build/reports/integrity-report.md
            spigot/build/reports/tests/test/
            common/build/reports/tests/test/
          retention-days: 14
