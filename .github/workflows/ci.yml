name: BlockProt Reloaded CI

run-name: "CI: ${{ github.event.head_commit.message || github.ref_name }}"

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'images/**'
      - '.gitignore'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'images/**'
      - '.gitignore'
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    name: Build, Verify & Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate commit convention
        run: |
          echo "Validating commit messages against BPR:<branch>(<type>): <description> convention..."
          REGEX="^BPR:(main|[a-zA-Z0-9_.-]+)\((fix|add|feat|refactor|docs|chore)\):\s.+"
          FAILED=0

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            COMMITS=$(git log --format="%s" origin/main..HEAD)
          else
            COMMITS=$(git log -1 --format="%s")
          fi

          while IFS= read -r msg; do
            [ -z "$msg" ] && continue
            if ! echo "$msg" | grep -qE "$REGEX"; then
              echo "ERROR: Commit message does not follow convention: '$msg'"
              echo "Required format: BPR:<branch>(<type>): <description>"
              echo "Valid types: fix, add, feat, refactor, docs, chore"
              FAILED=1
            fi
          done <<< "$COMMITS"

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi
          echo "All commit messages comply with repository convention."

      - name: Validate version field integrity
        if: github.event_name == 'pull_request'
        run: |
          echo "Verifying gradle.properties version immutability..."
          if git diff origin/main..HEAD -- gradle.properties | grep -qE '^\+[ ]*(blockProtVersion|versionSuffix)='; then
            echo "ERROR: gradle.properties version fields were modified."
            echo "Rule: Plugin release version numbers and tags are managed exclusively by the maintainer."
            echo "Please revert modifications to blockProtVersion and versionSuffix."
            exit 1
          fi
          echo "Version field integrity verified."

      - name: Validate GPL v3 license headers
        run: |
          echo "Verifying GPL v3 license headers on Java source files..."
          FAILED=0
          COUNT=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if [ -f "$file" ]; then
              COUNT=$((COUNT + 1))
              if ! grep -q "Copyright (C)" "$file" || ! grep -q "GNU General Public License" "$file"; then
                echo "ERROR: Missing standard GPL v3 license header in: $file"
                FAILED=1
              fi
            fi
          done < <(find spigot/src common/src -name "*.java" 2>/dev/null)

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi
          echo "All $COUNT Java source files preserve required GPL v3 license headers."

      - name: Validate absence of placeholder markers
        run: |
          echo "Verifying absence of placeholder markers (TODO, FIXME) in Java source files..."
          FAILED=0
          if grep -rnE --include="*.java" '//\s*(TODO|FIXME|XXX)' spigot/src common/src; then
            echo "ERROR: Stand-in placeholder markers found in source code."
            echo "Rule: Files must contain finished, tested code only without TODO or FIXME comments."
            FAILED=1
          fi

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi
          echo "No placeholder markers detected in Java sources."

      - name: Validate architectural boundary isolation
        run: |
          echo "Verifying pure Java isolation in :common (zero Bukkit/Spigot imports)..."
          FAILED=0
          if grep -rnE --include="*.java" 'import\s+(org\.bukkit|io\.papermc)\.' common/src; then
            echo "ERROR: Bukkit/Spigot imports detected in :common subproject."
            echo "Rule: Architectural separation mandates pure Java in :common."
            FAILED=1
          fi

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi
          echo ":common architectural boundary verified with 0 Bukkit imports."

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build and execute test suite
        run: ./gradlew build --no-daemon

      - name: Execute upstream server and dependency audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/audit_dependencies.py --json-output build/reports/dependency-audit.json --no-summary

      - name: Generate version commit summary
        run: |
          python3 .github/scripts/generate_version_commits.py --no-summary

      - name: Generate and publish unified CI report
        run: |
          python3 .github/scripts/generate_ci_summary.py

      - name: Upload compiled shadow JAR artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BlockProtReloaded-build-artifacts
          path: spigot/build/libs/BlockProtReloaded-*.jar
          retention-days: 7

      - name: Upload CI verification and audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: |
            build/reports/ci-summary.md
            build/reports/version-commits.md
            build/reports/dependency-audit.json
          retention-days: 7

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            spigot/build/reports/tests/test/
            common/build/reports/tests/test/
          retention-days: 7
