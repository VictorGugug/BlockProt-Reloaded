name: BlockProt Reloaded CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'images/**'
      - '.gitignore'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'images/**'
      - '.gitignore'
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    outputs:
      plugin_version: ${{ steps.meta.outputs.plugin_version }}
      latest_mc: ${{ steps.meta.outputs.latest_mc }}
      mc_range: ${{ steps.meta.outputs.mc_range }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve plugin metadata and Minecraft targets
        id: meta
        run: |
          PROPS="gradle.properties"
          BASE_VER=$(grep -E '^[[:space:]]*blockProtVersion=' "$PROPS" | cut -d'=' -f2 | tr -d '[:space:]')
          SUFFIX=$(grep -E '^[[:space:]]*versionSuffix=' "$PROPS" | cut -d'=' -f2 | tr -d '[:space:]')
          if [ -n "$SUFFIX" ]; then
            PLUGIN_VER="${BASE_VER}-${SUFFIX}"
          else
            PLUGIN_VER="${BASE_VER}"
          fi

          MC_LINE=$(grep -E '^[[:space:]]*#[[:space:]]*Supported on blockProtVersion' "$PROPS" | head -1)
          MC_LIST=$(echo "$MC_LINE" | cut -d':' -f2 | tr -d ' ')
          LATEST_MC=$(echo "$MC_LIST" | awk -F',' '{print $NF}')
          FIRST_MC=$(echo "$MC_LIST" | awk -F',' '{print $1}')
          MC_RANGE="${FIRST_MC} - ${LATEST_MC}"

          echo "plugin_version=${PLUGIN_VER}" >> "$GITHUB_OUTPUT"
          echo "latest_mc=${LATEST_MC}" >> "$GITHUB_OUTPUT"
          echo "mc_range=${MC_RANGE}" >> "$GITHUB_OUTPUT"

          echo "BlockProt Reloaded CI: Build and Test"
          echo "Current Plugin Version:          ${PLUGIN_VER}"
          echo "Latest Supported Minecraft:      ${LATEST_MC}"
          echo "Declared Minecraft Range:        ${MC_RANGE}"
          echo "Java Target:                     Bytecode 21 (JDK 25 Toolchain)"
          echo "Branch / Ref:                    ${GITHUB_REF_NAME}"
          echo "Commit SHA:                      ${GITHUB_SHA}"

          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          # BlockProt Reloaded CI Summary

          | Property | Value |
          | :--- | :--- |
          EOF
          echo "| **Current Plugin Version** | \`${PLUGIN_VER}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Latest Supported Minecraft** | \`${LATEST_MC}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Supported Minecraft Range** | \`${MC_RANGE}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Java Toolchain** | JDK 25 (Bytecode target 21) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Platform Target** | Paper Family (Paper, Purpur, Folia) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Ref / Commit** | \`${GITHUB_REF_NAME}\` (\`${GITHUB_SHA:0:8}\`) |" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build and execute test suite
        run: ./gradlew build --no-daemon

      - name: Publish build success to summary
        if: success()
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"

          ### Build and Test Status: Succeeded
          - All Gradle subprojects (:common, :blockprot-spigot) built and verified cleanly.
          - Paper runtime and MockBukkit test suites executed without errors.
          EOF

      - name: Upload compiled shadow JAR artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BlockProtReloaded-build-${{ steps.meta.outputs.plugin_version }}
          path: spigot/build/libs/BlockProtReloaded-*.jar
          retention-days: 7

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            spigot/build/reports/tests/test/
            common/build/reports/tests/test/
          retention-days: 7

  dependency-audit:
    name: Dependency and Integrations Audit
    needs: [build-and-test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute version audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x .github/scripts/audit_dependencies.py
          python3 .github/scripts/audit_dependencies.py
