name: Release

run-name: "Release [${{ inputs.mode }}]: ${{ inputs.version || 'auto-detected from gradle.properties' }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version or tag to process (leave blank to auto-detect from gradle.properties)"
        required: false
        default: ""
      mode:
        description: "Execution mode: Preview, Release, or Cancel"
        type: choice
        options:
          - "Preview (Dry-Run Pre-Flight Inspection)"
          - "Release (Create tag & GitHub release)"
          - "Cancel (Abort without action)"
        default: "Preview (Dry-Run Pre-Flight Inspection)"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Inspect Release
    runs-on: ubuntu-latest

    steps:
      - name: Handle cancellation request
        if: github.event.inputs.mode == 'Cancel (Abort without action)'
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          # Release Creation Cancelled

          > **Status:** Release creation was cancelled by operator selection (`mode: Cancel`).
          > No tags, GitHub releases, or build assets were published.
          EOF
          echo "Release creation cancelled by operator selection."

      - name: Checkout repository
        if: github.event.inputs.mode != 'Cancel (Abort without action)'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version from gradle.properties
        if: github.event.inputs.mode != 'Cancel (Abort without action)'
        id: ver
        run: |
          PROPS="gradle.properties"
          BASE_VER=$(grep -E '^[[:space:]]*blockProtVersion=' "$PROPS" | cut -d'=' -f2 | tr -d '[:space:]')
          SUFFIX=$(grep -E '^[[:space:]]*versionSuffix=' "$PROPS" | cut -d'=' -f2 | tr -d '[:space:]')
          if [ -n "$SUFFIX" ]; then
            AUTO_VER="${BASE_VER}-${SUFFIX}"
          else
            AUTO_VER="${BASE_VER}"
          fi
          INPUT_VER="${{ github.event.inputs.version }}"
          if [ -z "$INPUT_VER" ]; then
            TARGET_VER="$AUTO_VER"
          else
            TARGET_VER="$INPUT_VER"
          fi
          echo "version=$TARGET_VER" >> "$GITHUB_OUTPUT"

      - name: Generate version changelog
        if: github.event.inputs.mode != 'Cancel (Abort without action)'
        id: changelog
        run: |
          TARGET_VER="${{ steps.ver.outputs.version }}"
          CLEAN_VER="${TARGET_VER#v}"
          mkdir -p build/reports

          if [ -f "docs/RELEASE_NOTES/${TARGET_VER}.RELEASE_NOTES.md" ]; then
            NOTES_SRC="docs/RELEASE_NOTES/${TARGET_VER}.RELEASE_NOTES.md"
          elif [ -f "docs/RELEASE_NOTES/${CLEAN_VER}.RELEASE_NOTES.md" ]; then
            NOTES_SRC="docs/RELEASE_NOTES/${CLEAN_VER}.RELEASE_NOTES.md"
          elif echo "$CLEAN_VER" | grep -qiE -- '-(bedev|bdev|snapshot|exp)' && [ -f "docs/RELEASE_NOTES/${CLEAN_VER%%-*}.RELEASE_NOTES.md" ]; then
            NOTES_SRC="docs/RELEASE_NOTES/${CLEAN_VER%%-*}.RELEASE_NOTES.md"
          else
            NOTES_SRC=""
          fi

          if [ -n "$NOTES_SRC" ]; then
            echo "Loading curated release notes from: $NOTES_SRC"
            cp "$NOTES_SRC" build/reports/release-notes.md
            REPO_URL="${{ github.repository }}"
            REF="${{ github.ref_name }}"
            echo "notes_source=curated" >> "$GITHUB_OUTPUT"
            echo "notes_path=$NOTES_SRC" >> "$GITHUB_OUTPUT"
            echo "notes_url=https://github.com/${REPO_URL}/blob/${REF}/${NOTES_SRC}" >> "$GITHUB_OUTPUT"
          else
            echo "Curated release notes not found; aggregating git history commits..."
            python3 .github/scripts/generate_version_commits.py --version "$TARGET_VER" --release-body --output-file build/reports/release-notes.md
            echo "notes_source=generated" >> "$GITHUB_OUTPUT"
            echo "notes_path=build/reports/release-notes.md" >> "$GITHUB_OUTPUT"
            echo "notes_url=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 25
        if: github.event.inputs.mode != 'Cancel (Abort without action)'
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        if: github.event.inputs.mode != 'Cancel (Abort without action)'
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        if: github.event.inputs.mode != 'Cancel (Abort without action)'
        run: chmod +x gradlew

      - name: Build complete project artifacts
        if: github.event.inputs.mode != 'Cancel (Abort without action)'
        run: ./gradlew build :blockprot-spigot:shadowJar --no-daemon

      - name: Stage build artifacts for release
        if: github.event.inputs.mode != 'Cancel (Abort without action)'
        id: jar
        run: |
          JAR=$(find spigot/build/libs -name "BlockProtReloaded-*.jar" \
                ! -name "*-javadoc*" ! -name "*-sources*" | head -1)
          FILE_SIZE=$(ls -lh "$JAR" | awk '{print $5}')
          VERSION="${{ steps.ver.outputs.version }}"

          mkdir -p build/github-release
          cp "$JAR" build/github-release/

          SRC_JAR=$(find spigot/build/libs -name "*-sources.jar" | head -1)
          if [ -n "$SRC_JAR" ] && [ -f "$SRC_JAR" ]; then
            cp "$SRC_JAR" "build/github-release/BlockProtReloaded-${VERSION}-sources.jar"
          fi

          DOC_JAR=$(find spigot/build/libs -name "*-javadoc.jar" | head -1)
          if [ -n "$DOC_JAR" ] && [ -f "$DOC_JAR" ]; then
            cp "$DOC_JAR" "build/github-release/BlockProtReloaded-${VERSION}-javadoc.jar"
          fi

          COMMON_JAR=$(find common/build/libs -name "common-*.jar" | head -1)
          if [ -n "$COMMON_JAR" ] && [ -f "$COMMON_JAR" ]; then
            cp "$COMMON_JAR" build/github-release/
          fi

          cd build/github-release
          sha256sum *.jar > checksums.sha256
          cd ../..

          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "name=$(basename $JAR)" >> "$GITHUB_OUTPUT"
          echo "size=$FILE_SIZE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: github.event.inputs.mode == 'Release (Create tag & GitHub release)'
        id: gh_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: "BlockProt Reloaded ${{ steps.ver.outputs.version }}"
          body_path: build/reports/release-notes.md
          files: |
            build/github-release/BlockProtReloaded-*.jar
            build/github-release/common-*.jar
            build/github-release/checksums.sha256
          draft: false
          prerelease: ${{ contains(steps.ver.outputs.version, 'SNAPSHOT') || contains(steps.ver.outputs.version, 'BEDev') || contains(steps.ver.outputs.version, 'dev') || contains(steps.ver.outputs.version, 'alpha') || contains(steps.ver.outputs.version, 'beta') || contains(steps.ver.outputs.version, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release artifact
        if: github.event.inputs.mode != 'Cancel (Abort without action)'
        uses: actions/upload-artifact@v4
        with:
          name: blockprot-release-suite
          path: build/github-release/
          retention-days: 1

      - name: Publish release step summary
        if: github.event.inputs.mode != 'Cancel (Abort without action)'
        run: |
          if [ "${{ steps.changelog.outputs.notes_source }}" = "curated" ]; then
            NOTES_LINE="| **Release Notes File** | [\`${{ steps.changelog.outputs.notes_path }}\`](${{ steps.changelog.outputs.notes_url }}) |"
          else
            NOTES_LINE="| **Release Notes File** | \`build/reports/release-notes.md\` |"
          fi

          if [ "${{ github.event.inputs.mode }}" = "Release (Create tag & GitHub release)" ]; then
            cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ## GitHub Release Created Successfully

          | Metric | Details |
          | :--- | :--- |
          | **Release Name** | \`BlockProt Reloaded ${{ steps.ver.outputs.version }}\` |
          | **Tag Name** | \`${{ steps.ver.outputs.version }}\` |
          | **Asset** | \`${{ steps.jar.outputs.name }}\` (\`${{ steps.jar.outputs.size }}\`) |
          $NOTES_LINE
          | **Release URL** | [View Release](${{ steps.gh_release.outputs.url }}) |
          EOF
          else
            cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ## Release Pre-Flight Inspection (Dry-Run)

          | Metric | Details |
          | :--- | :--- |
          | **Release Name** | \`BlockProt Reloaded ${{ steps.ver.outputs.version }}\` |
          | **Tag Name** | \`${{ steps.ver.outputs.version }}\` |
          | **Asset** | \`${{ steps.jar.outputs.name }}\` (\`${{ steps.jar.outputs.size }}\`) |
          $NOTES_LINE
          | **Status** | Pre-Flight Verified (Dry-Run) |

          > [!IMPORTANT]
          > **DRY-RUN INSPECTION ONLY:** No GitHub release or tag was published.
          > All metadata, changelog generation, and JAR builds completed cleanly.
          > To publish the official release, re-run this workflow with mode **Release (Create tag & GitHub release)**.

          ### Release Notes Preview
          EOF
            cat build/reports/release-notes.md >> "$GITHUB_STEP_SUMMARY"
          fi
