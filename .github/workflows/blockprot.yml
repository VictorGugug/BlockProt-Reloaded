name: BlockProt Reloaded

run-name: "${{ github.event_name == 'workflow_dispatch' && format('{0}: {1} [{2}]', inputs.operation, inputs.tag || 'version from gradle.properties', inputs.suffix) || github.event_name == 'schedule' && 'Scheduled platform sync and maintenance' || format('CI: {0}', github.event.head_commit.message || github.ref_name) }}"

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'images/**'
      - '.gitignore'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'images/**'
      - '.gitignore'
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      operation:
        description: "What to run"
        type: choice
        options:
          - "Preview release (dry run)"
          - "Publish release"
          - "Sync platforms (publish the latest stable release where missing)"
          - "Maintenance report"
          - "Run CI"
        default: "Preview release (dry run)"
      suffix:
        description: "Release suffix: keep the one in gradle.properties, publish the next numbered BEDev build, or release as stable"
        type: choice
        options:
          - "From gradle.properties"
          - "BEDev (next numbered build)"
          - "Stable (remove suffix and update gradle.properties)"
        default: "From gradle.properties"
      tag:
        description: "Release notes version override (leave blank to use the version from gradle.properties)"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.operation }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: Build, Verify & Audit
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'Run CI')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install --quiet pyyaml

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate commit convention
        run: |
          echo "Validating commit messages against BPR:<branch>(<type>): <description> convention..."
          REGEX="^BPR:(main|[a-zA-Z0-9_.-]+)\((fix|add|feat|refactor|docs|chore)\):\s.+"
          FAILED=0

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            COMMITS=$(git log --format="%s" origin/main..HEAD)
          else
            COMMITS=$(git log -1 --format="%s")
          fi

          while IFS= read -r msg; do
            [ -z "$msg" ] && continue
            if ! echo "$msg" | grep -qE "$REGEX"; then
              echo "ERROR: Commit message does not follow convention: '$msg'"
              echo "Required format: BPR:<branch>(<type>): <description>"
              echo "Valid types: fix, add, feat, refactor, docs, chore"
              FAILED=1
            fi
          done <<< "$COMMITS"

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi
          echo "All commit messages comply with repository convention."

      - name: Validate version field integrity
        if: github.event_name == 'pull_request'
        run: |
          echo "Verifying gradle.properties version immutability..."
          if git diff origin/main..HEAD -- gradle.properties | grep -qE '^\+[ ]*(blockProtVersion|versionSuffix)='; then
            echo "ERROR: gradle.properties version fields were modified."
            echo "Rule: Plugin release version numbers and tags are managed exclusively by the maintainer."
            echo "Please revert modifications to blockProtVersion and versionSuffix."
            exit 1
          fi
          echo "Version field integrity verified."

      - name: Validate GPL v3 license headers
        run: |
          echo "Verifying GPL v3 license headers on Java source files..."
          FAILED=0
          COUNT=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if [ -f "$file" ]; then
              COUNT=$((COUNT + 1))
              if ! grep -q "Copyright (C)" "$file" || ! grep -q "GNU General Public License" "$file"; then
                echo "ERROR: Missing standard GPL v3 license header in: $file"
                FAILED=1
              fi
            fi
          done < <(find spigot/src common/src -name "*.java" 2>/dev/null)

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi
          echo "All $COUNT Java source files preserve required GPL v3 license headers."

      - name: Validate absence of placeholder markers
        run: |
          echo "Verifying absence of placeholder markers (TODO, FIXME) in Java source files..."
          FAILED=0
          if grep -rnE --include="*.java" '//\s*(TODO|FIXME|XXX)' spigot/src common/src; then
            echo "ERROR: Stand-in placeholder markers found in source code."
            echo "Rule: Files must contain finished, tested code only without TODO or FIXME comments."
            FAILED=1
          fi

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi
          echo "No placeholder markers detected in Java sources."

      - name: Validate architectural boundary isolation
        run: |
          echo "Verifying pure Java isolation in :common (zero Bukkit/Spigot imports)..."
          FAILED=0
          if grep -rnE --include="*.java" 'import\s+(org\.bukkit|io\.papermc)\.' common/src; then
            echo "ERROR: Bukkit/Spigot imports detected in :common subproject."
            echo "Rule: Architectural separation mandates pure Java in :common."
            FAILED=1
          fi

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi
          echo ":common architectural boundary verified with 0 Bukkit imports."

      - name: Run project file integrity audit
        run: |
          python3 .github/scripts/verify_project_integrity.py --report-path build/reports/integrity-report.md --summary

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build and execute test suite
        run: ./gradlew build --no-daemon

      - name: Execute upstream server and dependency audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/audit_dependencies.py --json-output build/reports/dependency-audit.json --no-summary

      - name: Generate version commit summary
        run: |
          python3 .github/scripts/generate_version_commits.py --no-summary

      - name: Generate and publish unified CI report
        run: |
          python3 .github/scripts/generate_ci_summary.py

      - name: Publish integrity report to summary
        if: always()
        run: |
          if [ -f "build/reports/integrity-report.md" ]; then
            cat build/reports/integrity-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload compiled shadow JAR artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BlockProtReloaded-build-artifacts
          path: spigot/build/libs/BlockProtReloaded-*.jar
          retention-days: 7

      - name: Upload CI verification and audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: |
            build/reports/ci-summary.md
            build/reports/integrity-report.md
            build/reports/version-commits.md
            build/reports/dependency-audit.json
          retention-days: 7

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            spigot/build/reports/tests/test/
            common/build/reports/tests/test/
          retention-days: 7

  server-smoke:
    name: Real Server Diagnostics (${{ matrix.project }})
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [ paper, folia ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download compiled shadow JAR
        uses: actions/download-artifact@v4
        with:
          name: BlockProtReloaded-build-artifacts
          path: build/ci-jar

      - name: Boot server and run console diagnostics
        run: |
          JAR=$(find build/ci-jar -name "BlockProtReloaded-*.jar" | head -1)
          {
            echo "## Real Server Diagnostics"
            echo ""
            echo "| Server | Result | Diagnostics |"
            echo "| :--- | :---: | :--- |"
          } >> "$GITHUB_STEP_SUMMARY"
          python3 .github/scripts/server_smoke_test.py --jar "$JAR" --project "${{ matrix.project }}"             --workdir build/smoke-server --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload server log and debug report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.project }}
          path: |
            build/smoke-server/console.log
            build/smoke-server/plugins/BlockProtReloaded/logs/
          retention-days: 7

  sync-check:
    name: Platform Publication Check
    if: github.event.schedule == '0 6 * * *' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'Sync platforms (publish the latest stable release where missing)')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.status.outputs.version }}
      targets: ${{ steps.status.outputs.targets }}
      needed: ${{ steps.status.outputs.needed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check the latest stable release on every platform
        id: status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
        run: python3 .github/scripts/platform_status.py --title "Latest stable release" --min-age-hours 1

  inspect-and-build:
    name: Pre-Flight Inspection & Artifact Verification
    needs: [sync-check]
    if: ${{ !cancelled() && (needs.sync-check.outputs.needed == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.operation == 'Preview release (dry run)' || inputs.operation == 'Publish release'))) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      plugin_version: ${{ steps.meta.outputs.plugin_version }}
      version_suffix: ${{ steps.meta.outputs.version_suffix }}
      stable_promotion: ${{ steps.meta.outputs.stable_promotion }}
      game_versions: ${{ steps.meta.outputs.game_versions }}
      supported_platforms: ${{ steps.meta.outputs.supported_platforms }}
      legacy_platforms: ${{ steps.meta.outputs.legacy_platforms }}
      unsupported_platforms: ${{ steps.meta.outputs.unsupported_platforms }}
      unsupported_versions: ${{ steps.meta.outputs.unsupported_versions }}
      loaders: ${{ steps.meta.outputs.loaders }}
      jar_name: ${{ steps.jar.outputs.name }}
      jar_size: ${{ steps.jar.outputs.size }}
      jar_sha256: ${{ steps.jar.outputs.sha256 }}
      jar_channel: ${{ steps.jar.outputs.channel }}
      github_only: ${{ steps.jar.outputs.github_only }}
      notes_path: ${{ steps.changelog.outputs.notes_path }}
      notes_url: ${{ steps.changelog.outputs.notes_url }}
      notes_source: ${{ steps.changelog.outputs.notes_source }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.sync-check.outputs.version || github.ref }}

      - name: Resolve metadata and server platforms from gradle.properties
        id: meta
        run: |
          PROPS="gradle.properties"
          BASE_VER=$(grep -E '^[[:space:]]*blockProtVersion=' "$PROPS" | cut -d'=' -f2 | tr -d '[:space:]')
          SUFFIX=$(grep -E '^[[:space:]]*versionSuffix=' "$PROPS" | cut -d'=' -f2 | tr -d '[:space:]')
          PROPS_SUFFIX="$SUFFIX"
          case "${{ github.event.inputs.suffix }}" in
            BEDev*) SUFFIX="BEDev" ;;
            Stable*) SUFFIX="" ;;
          esac
          if echo "$SUFFIX" | grep -qiE '^(bedev|bdev)(\.[0-9]+)?$'; then
            LAST=0
            for T in $(git tag -l "${BASE_VER}-BEDev.*"); do
              N="${T##*-BEDev.}"
              if echo "$N" | grep -qE '^[0-9]+$' && [ "$N" -gt "$LAST" ]; then LAST="$N"; fi
            done
            SUFFIX="BEDev.$((LAST + 1))"
          fi
          if [ -z "$SUFFIX" ] && [ -n "$PROPS_SUFFIX" ]; then
            STABLE_PROMOTION="true"
          else
            STABLE_PROMOTION="false"
          fi
          echo "version_suffix=${SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "props_suffix=${PROPS_SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "stable_promotion=${STABLE_PROMOTION}" >> "$GITHUB_OUTPUT"
          if [ -n "$SUFFIX" ]; then
            PLUGIN_VER="${BASE_VER}-${SUFFIX}"
          else
            PLUGIN_VER="${BASE_VER}"
          fi

          MC_LINE=$(grep -E '^[[:space:]]*#[[:space:]]*Supported on blockProtVersion' "$PROPS" | head -1)
          RAW_MC=$(echo "$MC_LINE" | cut -d':' -f2 | tr -d '\r\n')
          MC_LIST=$(echo "$RAW_MC" | tr -d ' ')
          FIRST_MC=$(echo "$MC_LIST" | awk -F',' '{print $1}')
          LATEST_MC=$(echo "$MC_LIST" | awk -F',' '{print $NF}')
          MC_RANGE="${FIRST_MC} - ${LATEST_MC}"

          # Format game versions for mc-publish (newline-delimited)
          MC_NEWLINES=$(echo "$RAW_MC" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | tr -d '\r' | grep -v '^$')

          PLATFORMS=$(grep -E '^[[:space:]]*supportedPlatforms=' "$PROPS" | cut -d'=' -f2 | tr -d '\r\n')
          LEGACY=$(grep -E '^[[:space:]]*legacyPlatforms=' "$PROPS" | cut -d'=' -f2 | tr -d '\r\n')
          UNSUPPORTED_PLATFORMS=$(grep -E '^[[:space:]]*unsupportedPlatforms=' "$PROPS" | cut -d'=' -f2 | tr -d '\r\n')
          UNSUPPORTED_VERSIONS=$(grep -E '^[[:space:]]*unsupportedVersions=' "$PROPS" | cut -d'=' -f2 | tr -d '\r\n')
          LOADERS=$(echo "$PLATFORMS" | tr '[:upper:]' '[:lower:]' | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | tr -d '\r' | grep -v '^$' | tr '\n' ' ')

          echo "plugin_version=${PLUGIN_VER}" >> "$GITHUB_OUTPUT"
          echo "mc_range=${MC_RANGE}" >> "$GITHUB_OUTPUT"
          echo "latest_mc=${LATEST_MC}" >> "$GITHUB_OUTPUT"
          {
            echo "game_versions<<EOF"
            echo "$MC_NEWLINES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "supported_platforms=${PLATFORMS}" >> "$GITHUB_OUTPUT"
          echo "legacy_platforms=${LEGACY}" >> "$GITHUB_OUTPUT"
          echo "unsupported_platforms=${UNSUPPORTED_PLATFORMS}" >> "$GITHUB_OUTPUT"
          echo "unsupported_versions=${UNSUPPORTED_VERSIONS}" >> "$GITHUB_OUTPUT"
          echo "loaders=${LOADERS}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes changelog
        id: changelog
        run: |
          TARGET_TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TARGET_TAG" ]; then
            TARGET_TAG="${{ steps.meta.outputs.plugin_version }}"
          fi
          CLEAN_TAG="${TARGET_TAG#v}"
          mkdir -p build/reports

          if [ -f "docs/RELEASE_NOTES/${TARGET_TAG}.RELEASE_NOTES.md" ]; then
            NOTES_SRC="docs/RELEASE_NOTES/${TARGET_TAG}.RELEASE_NOTES.md"
          elif [ -f "docs/RELEASE_NOTES/${CLEAN_TAG}.RELEASE_NOTES.md" ]; then
            NOTES_SRC="docs/RELEASE_NOTES/${CLEAN_TAG}.RELEASE_NOTES.md"
          elif echo "$CLEAN_TAG" | grep -qiE -- '-(bedev|bdev|snapshot|exp)' && [ -f "docs/RELEASE_NOTES/${CLEAN_TAG%%-*}.RELEASE_NOTES.md" ]; then
            NOTES_SRC="docs/RELEASE_NOTES/${CLEAN_TAG%%-*}.RELEASE_NOTES.md"
          elif [ -f "docs/RELEASE_NOTES/${{ steps.meta.outputs.plugin_version }}.RELEASE_NOTES.md" ]; then
            NOTES_SRC="docs/RELEASE_NOTES/${{ steps.meta.outputs.plugin_version }}.RELEASE_NOTES.md"
          else
            NOTES_SRC=""
          fi

          if [ -n "$NOTES_SRC" ]; then
            echo "Loading curated release notes from: $NOTES_SRC"
            cp "$NOTES_SRC" build/reports/release-notes.md
            REPO_URL="${{ github.repository }}"
            REF="${{ github.ref_name }}"
            echo "notes_source=curated" >> "$GITHUB_OUTPUT"
            echo "notes_path=$NOTES_SRC" >> "$GITHUB_OUTPUT"
            echo "notes_url=https://github.com/${REPO_URL}/blob/${REF}/${NOTES_SRC}" >> "$GITHUB_OUTPUT"
          else
            echo "Curated release notes not found; aggregating git commit history..."
            python3 .github/scripts/generate_version_commits.py --version "$TARGET_TAG" --release-body --output-file build/reports/release-notes.md
            echo "notes_source=generated" >> "$GITHUB_OUTPUT"
            echo "notes_path=build/reports/release-notes.md" >> "$GITHUB_OUTPUT"
            echo "notes_url=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build complete project artifacts
        run: ./gradlew build :blockprot-spigot:shadowJar --no-daemon "-PversionSuffix=${{ steps.meta.outputs.version_suffix }}"

      - name: Inspect compiled JAR, hash, and metadata
        id: jar
        run: |
          JAR=$(find spigot/build/libs -name "BlockProtReloaded-*.jar" \
                ! -name "*-javadoc*" ! -name "*-sources*" | head -1)
          JAR_NAME=$(basename "$JAR")
          VERSION=$(basename "$JAR" .jar | sed 's/^BlockProtReloaded-//')

          if echo "$VERSION" | grep -qiE 'snapshot|alpha|dev|nightly|wip|bedev'; then
            CHANNEL="alpha"
          elif echo "$VERSION" | grep -qiE 'beta|rc'; then
            CHANNEL="beta"
          else
            CHANNEL="release"
          fi

          if echo "$VERSION" | grep -qiE 'bedev|bdev|snapshot|(^|-)exp'; then
            GITHUB_ONLY="true"
          else
            GITHUB_ONLY="false"
          fi

          FILE_SIZE=$(ls -lh "$JAR" | awk '{print $5}')
          SHA256=$(sha256sum "$JAR" | awk '{print $1}')

          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "name=$JAR_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "github_only=$GITHUB_ONLY" >> "$GITHUB_OUTPUT"
          echo "size=$FILE_SIZE" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Stage build artifacts for publication
        run: |
          mkdir -p build/staged-upload/clean
          mkdir -p build/staged-upload/github

          # 1. Clean distribution for plugin platforms (Modrinth, CurseForge, Hangar)
          cp "${{ steps.jar.outputs.path }}" build/staged-upload/clean/
          cp build/reports/release-notes.md build/staged-upload/clean/release-notes.md

          # 2. Complete build suite for GitHub Releases (binary, sources, javadocs, common, checksums)
          VERSION="${{ steps.jar.outputs.version }}"
          cp "${{ steps.jar.outputs.path }}" build/staged-upload/github/

          SRC_JAR=$(find spigot/build/libs -name "*-sources.jar" | head -1)
          if [ -n "$SRC_JAR" ] && [ -f "$SRC_JAR" ]; then
            cp "$SRC_JAR" "build/staged-upload/github/BlockProtReloaded-${VERSION}-sources.jar"
          fi

          DOC_JAR=$(find spigot/build/libs -name "*-javadoc.jar" | head -1)
          if [ -n "$DOC_JAR" ] && [ -f "$DOC_JAR" ]; then
            cp "$DOC_JAR" "build/staged-upload/github/BlockProtReloaded-${VERSION}-javadoc.jar"
          fi

          COMMON_JAR=$(find common/build/libs -name "common-*.jar" | head -1)
          if [ -n "$COMMON_JAR" ] && [ -f "$COMMON_JAR" ]; then
            cp "$COMMON_JAR" build/staged-upload/github/
          fi

          cp build/reports/release-notes.md build/staged-upload/github/release-notes.md

          cd build/staged-upload/github
          sha256sum *.jar > checksums.sha256
          cd ../../..

          echo "Staged clean files for distributor platforms:"
          ls -la build/staged-upload/clean
          echo "Staged complete build files for GitHub Releases:"
          ls -la build/staged-upload/github

      - name: Upload staged build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blockprot-staged-release
          path: build/staged-upload/
          retention-days: 1

      - name: Publish Pre-Flight Inspection Summary
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          # Pre-Flight Release Inspection Report

          | Metric / Property | Evaluated Value | Source Location |
          | :--- | :--- | :--- |
          EOF
          echo "| **Active Version** | \`${{ steps.meta.outputs.plugin_version }}\` | \`gradle.properties\` (\`blockProtVersion\`) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Version Suffix** | \`${{ steps.meta.outputs.version_suffix || '(none, stable)' }}\` | Selected: ${{ github.event.inputs.suffix }} (gradle.properties: \`${{ steps.meta.outputs.props_suffix || 'blank' }}\`) |" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.meta.outputs.stable_promotion }}" = "true" ]; then
            echo "| **gradle.properties Update** | \`versionSuffix\` will be cleared and committed on Publish | Stable promotion |" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "| **Target Minecraft Range** | \`${{ steps.meta.outputs.mc_range }}\` | \`gradle.properties\` (\`Supported on...\`) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Supported Server Software** | \`${{ steps.meta.outputs.supported_platforms }}\` | \`gradle.properties\` (\`supportedPlatforms\`) |" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.meta.outputs.legacy_platforms }}" ]; then
            echo "| **Legacy / Deprecated Software** | \`${{ steps.meta.outputs.legacy_platforms }}\` (End-of-Support) | \`gradle.properties\` (\`legacyPlatforms\`) |" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "| **Unsupported Server Software** | \`${{ steps.meta.outputs.unsupported_platforms }}\` | \`gradle.properties\` (\`unsupportedPlatforms\`) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Unsupported Minecraft Versions** | \`${{ steps.meta.outputs.unsupported_versions }}\` | \`gradle.properties\` (\`unsupportedVersions\`) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Distribution Binary** | \`${{ steps.jar.outputs.name }}\` (\`${{ steps.jar.outputs.size }}\`) | \`spigot/build/libs/${{ steps.jar.outputs.name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Artifact SHA-256** | \`${{ steps.jar.outputs.sha256 }}\` | Checksum verification |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Release Channel** | \`${{ steps.jar.outputs.channel }}\` | Inferred from version |" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.jar.outputs.github_only }}" = "true" ]; then
            echo "| **Distribution Scope** | GitHub Releases only (pre-release) | Development build suffix detected in version |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| **Distribution Scope** | GitHub, Modrinth, CurseForge, Hangar | Stable or hotfix version |" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.changelog.outputs.notes_source }}" = "curated" ]; then
            echo "| **Release Notes File** | [\`${{ steps.changelog.outputs.notes_path }}\`](${{ steps.changelog.outputs.notes_url }}) | Curated Project Release Documentation |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| **Release Notes File** | \`build/reports/release-notes.md\` | Generated from Git history |" >> "$GITHUB_STEP_SUMMARY"
          fi

          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"

          ### Distribution Platform Credentials & Targets

          | Platform | Configuration Status | Target Project / Assets |
          | :--- | :---: | :--- |
          | **GitHub Releases** | [v] Ready | Complete Build Assets (Shadow JAR, Sources, Javadoc, Common, SHA-256) |
          EOF
          if [ -n "${{ secrets.MODRINTH_TOKEN }}" ]; then
            echo "| **Modrinth** | [v] Ready | \`${{ vars.MODRINTH_PROJECT_ID || 'blockprot-reloaded' }}\` |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| **Modrinth** | [x] Missing Token | Secret \`MODRINTH_TOKEN\` not configured |" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "${{ secrets.CURSEFORGE_TOKEN }}" ]; then
            echo "| **CurseForge** | [v] Ready | Project ID \`${{ vars.CURSEFORGE_PROJECT_ID }}\` |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| **CurseForge** | [x] Missing Token | Secret \`CURSEFORGE_TOKEN\` not configured |" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "${{ secrets.HANGAR_API_TOKEN }}" ]; then
            echo "| **Hangar** | [v] Ready | \`BlockProt-Reloaded\` |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| **Hangar** | [x] Missing Token | Secret \`HANGAR_API_TOKEN\` not configured |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ inputs.operation }}" = "Publish release" ] || [ "${{ needs.sync-check.outputs.needed }}" = "true" ]; then
            cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"

          > [!NOTE]
          > **CONFIRMATION RECEIVED:** publication requested. Proceeding to live publication in the next job...
          EOF
          else
            cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"

          > [!IMPORTANT]
          > **PRE-FLIGHT INSPECTION ONLY (DRY-RUN):** preview requested.
          > All metadata, compiled binaries, checksums, platforms, and changelogs were successfully gathered and verified. **No files were uploaded to any platform.**
          > To publish this release, re-run this workflow with operation **Publish release**.
          EOF
          fi

          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"

          ### Release Notes Preview
          EOF
          cat build/reports/release-notes.md >> "$GITHUB_STEP_SUMMARY"

  publish-platforms:
    name: Execute Multi-Platform Publication
    needs: [sync-check, inspect-and-build]
    if: ${{ !cancelled() && needs.inspect-and-build.result == 'success' && (inputs.operation == 'Publish release' || needs.sync-check.outputs.needed == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.sync-check.outputs.version || github.ref }}

      - name: Download staged release artifacts
        uses: actions/download-artifact@v4
        with:
          name: blockprot-staged-release
          path: build/staged/

      - name: Locate staged artifacts and release notes
        id: staged
        run: |
          CLEAN_JAR=$(find build/staged/clean -name "BlockProtReloaded-*.jar" ! -name "*-javadoc*" ! -name "*-sources*" | head -1)
          CLEAN_NOTES=$(find build/staged/clean -name "release-notes.md" -o -name "*.md" | head -1)
          GITHUB_NOTES=$(find build/staged/github -name "release-notes.md" -o -name "*.md" | head -1)

          if [ -z "$CLEAN_JAR" ] || [ ! -f "$CLEAN_JAR" ]; then
            echo "::error::Could not find staged clean BlockProt JAR in build/staged/clean!"
            find build/staged -type f || true
            exit 1
          fi
          if [ -z "$CLEAN_NOTES" ] || [ ! -f "$CLEAN_NOTES" ]; then
            echo "::error::Could not find staged release notes in build/staged/clean!"
            find build/staged -type f || true
            exit 1
          fi

          echo "clean_jar=$CLEAN_JAR" >> "$GITHUB_OUTPUT"
          echo "clean_notes=$CLEAN_NOTES" >> "$GITHUB_OUTPUT"
          echo "github_notes=$GITHUB_NOTES" >> "$GITHUB_OUTPUT"
          echo "Staged Clean JAR (for distributors): $CLEAN_JAR ($(ls -lh "$CLEAN_JAR" | awk '{print $5}'))"
          echo "Staged GitHub Releases suite:"
          ls -la build/staged/github

      - name: Promote gradle.properties to stable
        id: promote
        if: needs.inspect-and-build.outputs.stable_promotion == 'true'
        env:
          VERSION: ${{ needs.inspect-and-build.outputs.plugin_version }}
        run: |
          sed -i -E 's/^([[:space:]]*versionSuffix=).*/\1/' gradle.properties
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          git commit -m "BPR:${{ github.ref_name }}(chore): Release ${VERSION}"
          git push origin "HEAD:${{ github.ref_name }}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Releases
        id: gh_release
        if: needs.sync-check.outputs.needed != 'true' || contains(needs.sync-check.outputs.targets, 'github')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.inspect-and-build.outputs.plugin_version }}
          target_commitish: ${{ steps.promote.outputs.sha || github.sha }}
          name: "BlockProt Reloaded ${{ needs.inspect-and-build.outputs.plugin_version }}"
          body_path: ${{ steps.staged.outputs.github_notes }}
          files: |
            build/staged/github/BlockProtReloaded-*.jar
            build/staged/github/common-*.jar
            build/staged/github/checksums.sha256
          draft: false
          prerelease: ${{ contains(needs.inspect-and-build.outputs.plugin_version, 'SNAPSHOT') || contains(needs.inspect-and-build.outputs.plugin_version, 'BEDev') || contains(needs.inspect-and-build.outputs.plugin_version, 'dev') || contains(needs.inspect-and-build.outputs.plugin_version, 'alpha') || contains(needs.inspect-and-build.outputs.plugin_version, 'beta') || contains(needs.inspect-and-build.outputs.plugin_version, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect existing platform releases
        id: detect
        if: needs.inspect-and-build.outputs.github_only != 'true'
        run: |
          VERSION="${{ needs.inspect-and-build.outputs.plugin_version }}"
          MODRINTH_ID="${{ vars.MODRINTH_PROJECT_ID || 'blockprot-reloaded' }}"
          CF_ID="${{ vars.CURSEFORGE_PROJECT_ID || '1565977' }}"

          # 1. Modrinth duplicate check
          if curl -s "https://api.modrinth.com/v2/project/${MODRINTH_ID}/version" | grep -q "\"version_number\":\"${VERSION}\""; then
            echo "Modrinth already has version ${VERSION}. Will skip Modrinth upload to avoid duplicate conflict."
            echo "modrinth_skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "modrinth_skip=false" >> "$GITHUB_OUTPUT"
          fi

          # 2. CurseForge duplicate check
          if curl -s "https://api.cfwidget.com/${CF_ID}" | grep -qF "\"name\":\"BlockProtReloaded-${VERSION}.jar\""; then
            echo "CurseForge already has version ${VERSION}. Will skip CurseForge upload to avoid duplicate conflict."
            echo "curseforge_skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "curseforge_skip=false" >> "$GITHUB_OUTPUT"
          fi

          # 3. Hangar duplicate check
          if curl -s "https://hangar.papermc.io/api/v1/projects/BlockProt-Reloaded/versions?limit=10" | grep -q "\"name\":\"${VERSION}\""; then
            echo "Hangar already has version ${VERSION}. Will skip Hangar upload to avoid duplicate conflict."
            echo "hangar_skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "hangar_skip=false" >> "$GITHUB_OUTPUT"
          fi

          # 4. Scheduled sync: only publish to the platforms reported as missing
          if [ "${{ needs.sync-check.outputs.needed }}" = "true" ]; then
            TARGETS=",${{ needs.sync-check.outputs.targets }},"
            for P in modrinth curseforge hangar; do
              case "$TARGETS" in
                *",$P,"*) ;;
                *) echo "${P}_skip=true" >> "$GITHUB_OUTPUT" ;;
              esac
            done
          fi

      - name: Publish to Modrinth & CurseForge
        if: needs.inspect-and-build.outputs.github_only != 'true' && ((env.MODRINTH_TOKEN != '' && steps.detect.outputs.modrinth_skip != 'true') || (env.CURSEFORGE_TOKEN != '' && steps.detect.outputs.curseforge_skip != 'true'))
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID || 'blockprot-reloaded' }}
          modrinth-token: ${{ steps.detect.outputs.modrinth_skip != 'true' && secrets.MODRINTH_TOKEN || '' }}
          modrinth-unfeature-mode: none
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID || '1565977' }}
          curseforge-token: ${{ steps.detect.outputs.curseforge_skip != 'true' && secrets.CURSEFORGE_TOKEN || '' }}
          files: ${{ steps.staged.outputs.clean_jar }}
          name: "BlockProt Reloaded ${{ needs.inspect-and-build.outputs.plugin_version }}"
          version: ${{ needs.inspect-and-build.outputs.plugin_version }}
          version-type: ${{ needs.inspect-and-build.outputs.jar_channel }}
          changelog-file: ${{ steps.staged.outputs.clean_notes }}
          game-versions: ${{ needs.inspect-and-build.outputs.game_versions }}
          game-version-filter: none
          loaders: ${{ needs.inspect-and-build.outputs.loaders }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}

      - name: Set up JDK 25
        if: needs.inspect-and-build.outputs.github_only != 'true' && env.HANGAR_API_TOKEN != '' && steps.detect.outputs.hangar_skip != 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        if: needs.inspect-and-build.outputs.github_only != 'true' && env.HANGAR_API_TOKEN != '' && steps.detect.outputs.hangar_skip != 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        if: needs.inspect-and-build.outputs.github_only != 'true' && env.HANGAR_API_TOKEN != '' && steps.detect.outputs.hangar_skip != 'true'
        run: chmod +x gradlew

      - name: Publish to Hangar
        id: hangar
        continue-on-error: true
        if: needs.inspect-and-build.outputs.github_only != 'true' && env.HANGAR_API_TOKEN != '' && steps.detect.outputs.hangar_skip != 'true'
        run: |
          CLEAN_TOKEN=$(echo "$HANGAR_API_TOKEN" | tr -d ' "\r\n\t'"'")
          LEN=${#CLEAN_TOKEN}
          if [ "$LEN" -ne 73 ]; then
            echo "::warning::HANGAR_API_TOKEN length is $LEN characters. Hangar requires a 73-character key (<UUID>.<token>). If publishing fails with 400 Bad Request, verify your secret in GitHub Settings."
          fi
          HANGAR_API_TOKEN="$CLEAN_TOKEN" ./gradlew :blockprot-spigot:publishPluginPublicationToHangar --stacktrace --no-daemon
        env:
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}

      - name: Publish Confirmation Summary
        if: always()
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          # Multi-Platform Publication Completed Successfully

          | Platform | Upload Status | Details |
          | :--- | :---: | :--- |
          EOF
          if [ "${{ steps.gh_release.outcome }}" = "skipped" ]; then
            echo "| **GitHub Releases** | [v] Already Live | Release \`${{ needs.inspect-and-build.outputs.plugin_version }}\` already exists |" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.gh_release.outcome }}" = "success" ]; then
            echo "| **GitHub Releases** | [v] Published | Tag \`${{ needs.inspect-and-build.outputs.plugin_version }}\` (Complete Build Assets Attached) |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| **GitHub Releases** | [x] Failed | Could not create GitHub Release |" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ needs.inspect-and-build.outputs.github_only }}" = "true" ]; then
            echo "| **Modrinth / CurseForge / Hangar** | [-] Not applicable | Development build: published on GitHub Releases only |" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "${{ steps.detect.outputs.modrinth_skip }}" = "true" ]; then
            echo "| **Modrinth** | [v] Already Live | Version \`${{ needs.inspect-and-build.outputs.plugin_version }}\` was already published on Modrinth (skipped duplicate) |" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "${{ secrets.MODRINTH_TOKEN }}" ]; then
            echo "| **Modrinth** | [v] Published | Project \`${{ vars.MODRINTH_PROJECT_ID || 'blockprot-reloaded' }}\` (Clean Shadow JAR) |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| **Modrinth** | [x] Skipped | Token not set |" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.detect.outputs.curseforge_skip }}" = "true" ]; then
            echo "| **CurseForge** | [v] Already Live | Version \`${{ needs.inspect-and-build.outputs.plugin_version }}\` was already published on CurseForge (skipped duplicate) |" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "${{ secrets.CURSEFORGE_TOKEN }}" ]; then
            echo "| **CurseForge** | [v] Published | Project ID \`${{ vars.CURSEFORGE_PROJECT_ID || '1565977' }}\` (Clean Shadow JAR) |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| **CurseForge** | [x] Skipped | Token not set |" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.detect.outputs.hangar_skip }}" = "true" ]; then
            echo "| **Hangar** | [v] Already Live | Version \`${{ needs.inspect-and-build.outputs.plugin_version }}\` was already published on Hangar (skipped duplicate) |" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "${{ secrets.HANGAR_API_TOKEN }}" ]; then
            if [ "${{ steps.hangar.outcome }}" = "success" ]; then
              echo "| **Hangar** | [v] Published | Project \`BlockProt-Reloaded\` (Clean Shadow JAR) |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| **Hangar** | [!] Issue | Check Hangar API key format (must be 73 characters <UUID>.<token>) |" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "| **Hangar** | [x] Skipped | Token not set |" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish Discord announcement template
        if: always() && steps.gh_release.outcome == 'success'
        env:
          VERSION: ${{ needs.inspect-and-build.outputs.plugin_version }}
          GITHUB_ONLY: ${{ needs.inspect-and-build.outputs.github_only }}
          REPO: ${{ github.repository }}
          MODRINTH_ID: ${{ vars.MODRINTH_PROJECT_ID || 'blockprot-reloaded' }}
        run: |
          FENCE='```'
          {
            echo ""
            echo "## Discord Announcement"
            echo ""
            echo "Copy each block into the release forum post."
            echo ""
            echo "**Post title**"
            echo "${FENCE}"
            echo "${VERSION} RELEASE"
            echo "${FENCE}"
            echo "**Tag**"
            echo "${FENCE}"
            echo "V - ${VERSION}"
            echo "${FENCE}"
            echo "**Message 1: GitHub release**"
            echo "${FENCE}"
            echo "https://github.com/${REPO}/releases/tag/${VERSION}"
            echo "${FENCE}"
            if [ "$GITHUB_ONLY" = "true" ]; then
              echo "Development build: GitHub Releases only, no platform links."
            else
            echo "**Message 2: Download platforms**"
            echo "${FENCE}"
            echo "**MODRINTH:**"
            echo "https://modrinth.com/plugin/${MODRINTH_ID}/version/${VERSION}"
            echo "**CURSEFORGE:**"
            echo "https://www.curseforge.com/minecraft/bukkit-plugins/blockprot-reloaded"
            echo "**HANGAR:**"
            echo "https://hangar.papermc.io/VictorGugug/BlockProt-Reloaded/versions/${VERSION}"
            echo "${FENCE}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  verify-publication:
    name: Verify Publication on Every Platform
    needs: [inspect-and-build, publish-platforms]
    if: ${{ !cancelled() && needs.publish-platforms.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Confirm the release is live
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          VERSION: ${{ needs.inspect-and-build.outputs.plugin_version }}
          GITHUB_ONLY: ${{ needs.inspect-and-build.outputs.github_only }}
        run: |
          if [ "$GITHUB_ONLY" = "true" ]; then
            REQUIRED="github"
          else
            REQUIRED="github modrinth hangar"
          fi
          for ATTEMPT in 1 2 3 4 5; do
            MISSING=$(python3 .github/scripts/platform_status.py --version "$VERSION" | python3 -c "import json,sys; print(' '.join(json.load(sys.stdin)['missing']))")
            FAILED=""
            for P in $REQUIRED; do
              case " $MISSING " in *" $P "*) FAILED="$FAILED $P" ;; esac
            done
            [ -z "$FAILED" ] && break
            echo "Attempt $ATTEMPT: not visible yet on:$FAILED"
            sleep 60
          done
          GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" python3 .github/scripts/platform_status.py --version "$VERSION" --title "Publication check" > /dev/null
          if [ "$GITHUB_ONLY" != "true" ]; then
            case " $MISSING " in
              *" curseforge "*) echo "::notice::CurseForge lists new files only after manual review; the daily platform sync republishes it if it is still missing after 72 hours." ;;
            esac
          fi
          if [ -n "$FAILED" ]; then
            echo "::error::Release $VERSION is not live on:$FAILED"
            exit 1
          fi

  maintenance:
    name: Upstream, Compatibility & Dependency Check
    if: github.event.schedule == '0 7 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'Maintenance report')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install --quiet pyyaml

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin JAR
        run: |
          chmod +x gradlew
          ./gradlew :blockprot-spigot:shadowJar --no-daemon

      - name: Run weekly checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JAR=$(find spigot/build/libs -name "BlockProtReloaded-*.jar" | head -1)
          python3 .github/scripts/weekly_maintenance.py --jar "$JAR" --output build/reports/weekly-maintenance.md
          if [ -s build/reports/weekly-maintenance.md ]; then
            cat build/reports/weekly-maintenance.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No findings this week." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create, update, or close the maintenance issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "Weekly maintenance report"
        run: |
          REPORT=build/reports/weekly-maintenance.md
          EXISTING=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          if [ ! -s "$REPORT" ]; then
            if [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" --comment "Everything is up to date as of this week's check."
            fi
            exit 0
          fi
          if [ -n "$EXISTING" ]; then
            CURRENT=$(gh issue view "$EXISTING" --json body --jq .body)
            if [ "$CURRENT" = "$(cat "$REPORT")" ]; then
              echo "Report unchanged; issue #$EXISTING left as is."
              exit 0
            fi
            gh issue edit "$EXISTING" --body-file "$REPORT"
          else
            gh issue create --title "$TITLE" --body-file "$REPORT"
          fi

      - name: Upload maintenance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-maintenance
          path: |
            build/reports/weekly-maintenance.md
            build/reports/weekly-dependency-audit.json
            build/weekly-*/console.log
          retention-days: 14
