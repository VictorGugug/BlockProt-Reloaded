# BlockProt: MySQL / Storage
# BlockProt Reloaded (BPR)
# Protection data always lives in NBT/PDC on the blocks themselves.
# Enable MySQL to mirror block locations and trust lists into a shared
# database index for searching and auditing on large servers.
# Run /bp reload to apply changes without restarting.

mysql:
  # Mirror protection data into the MySQL index.
  enabled: false

  # Database host address.
  host: "127.0.0.1"

  # Database port.
  port: 3306

  # Database name.
  database: "blockprot"

  # Database user.
  username: "blockprot"

  # Database password.
  password: ""

  # Optional: full JDBC URL. When set, host/port/database above are ignored.
  jdbc_url: ""

  pool:
    # Maximum number of connections in the HikariCP pool.
    maximum_pool_size: 10

    # Minimum number of idle connections kept alive.
    minimum_idle: 2

    # Time in milliseconds before a connection attempt times out.
    connection_timeout_ms: 10000
