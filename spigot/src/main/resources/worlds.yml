# worlds.yml — BlockProt Reloaded
# Per-world block configuration. Active when config.yml has: per_worlds_config: true
# (Previously: worlds_config_enabled. Migrated automatically on first startup.)
# Reference: docs/BLOCK_FAMILY_SYNTAX.md  |  docs/LOCKABLE_BLOCKS_REFERENCE.md
#
# Keys per world:
#   enabled                        — true/false to enable protection in this world
#   auto_drop_to_inventory_enabled — true/false for shulker auto-drop
#   lockable_tile_entities         — chests, furnaces, barrels, etc.
#   lockable_shulker_boxes         — shulker box variants
#   lockable_blocks                — doors, trapdoors, gates, workstations, etc.
#   lockable_doors                 — door variants (subset of lockable_blocks)
#   lockable_entities              — chest boats, chest minecarts, hopper minecarts
#                                    (leave as [] or omit to disable entity protection)

worlds:
