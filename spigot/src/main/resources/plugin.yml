name: BlockProtReloaded
version: ${version}
main: de.sean.blockprot.bukkit.BlockProt
api-version: '1.20'
authors: [ Zar ]
description: Block protection plugin, BlockProt Reloaded
prefix: BlockProt Reloaded
website: https://github.com/VictorGugug/BlockProt-Reloaded
folia-supported: true
permissions:
  blockprot.user:
    default: true
    description: >
      Grants access to all standard player features: locking blocks, managing friends,
      personal settings, statistics, transfer, and the /bp user menu.
  blockprot.user.admin:
    default: op
    description: >
      Grants all admin features: reload, update check, integrations list, debug,
      /bp info, /bp unlock, /bp protdel, and the /bp admin menu.
      Also allows breaking any protected block or shulker owned by another player,
      with protection data automatically cleared on break.
    children:
      blockprot.user: true
  blockprot.user.admin.t1:
    default: false
    description: >
      Tier 1 Moderator: Inspection commands, statistics teleport, and viewing audit logs.
    children:
      blockprot.user: true
  blockprot.user.admin.t2:
    default: false
    description: >
      Tier 2 Helper: Intervention commands, unlocking blocks, breaking protected blocks, and lockables configuration.
    children:
      blockprot.user.admin.t1: true
  blockprot.user.admin.t3:
    default: false
    description: >
      Tier 3 Admin: Maintenance commands, mass protection deletion, and admin configuration dialogs.
    children:
      blockprot.user.admin.t2: true
  blockprot.user.admin.owner:
    default: op
    description: >
      Tier 4 Owner: Full system control, plugin reload, update checker, and in-game execution of recommended configuration.
    children:
      blockprot.user.admin.t3: true
  blockprot.user.admin.custom:
    default: false
    description: >
      Custom Admin: Uses granular action permissions configured via player settings or admins.yml.
    children:
      blockprot.user: true
  blockprot.lockmax:
    default: false
    description: >
      Exempts the player from the player_max_locked_block_count limit in config.yml
      (unlimited locked blocks). Assign to VIPs, donors, or trusted players who
      should protect more blocks than the configured cap allows.
  blockprot.locklimit.<N>:
    default: false
    description: >
      Dynamic node that overrides the per-player cap with a specific number:
      replace <N> with the number (e.g. blockprot.locklimit.500 = max 500 locked
      blocks). The highest granted value wins.
  blockprot.blocks.tp:
    default: op
    description: >
      Allows teleporting to a protected block from the statistics inventory
      (left-click on a location entry).
  blockprot.debug:
    default: op
    description: >
      Allows running diagnostic checks and viewing debug output via /bp debug.
commands:
  blockprot:
    description: The main blockprot command
    usage: "/bp [command]"
    aliases: ["bp"]
softdepend:
  - Towny
  - PlaceholderAPI
  - WorldGuard
  - Lands
  - ClaimChunk
  - ViaVersion
  - ViaBackwards
  - Floodgate
  - Geyser-Spigot
