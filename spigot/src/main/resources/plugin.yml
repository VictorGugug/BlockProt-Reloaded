name: BlockProtReloaded
version: ${version}
main: de.sean.blockprot.bukkit.BlockProt
api-version: '1.21.1'
authors: [ Zar ]
description: Block protection plugin, BlockProt Reloaded
prefix: BlockProt Reloaded
website: https://github.com/VictorGugug/BlockProt-Reloaded
folia-supported: true
permissions:
  blockprot.user:
    default: true
    description: >
      Grants access to all standard player features: locking blocks, managing friends,
      personal settings, statistics, transfer, and the /bp user menu.
  blockprot.user.admin:
    default: op
    description: >
      Grants all admin features: reload, update check, integrations list, debug,
      /bp info, /bp unlock, /bp protdel, and the /bp admin menu.
      Also allows breaking any protected block or shulker owned by another player,
      with protection data automatically cleared on break.
    children:
      blockprot.user: true
  blockprot.max_blocks:
    default: false
    description: >
      Exempts the player from the player_max_locked_block_count limit in config.yml.
      Assign to VIPs, donors, or trusted players who should protect more blocks than
      the configured cap allows.
  blockprot.blocks.tp:
    default: op
    description: >
      Allows teleporting to a protected block from the statistics inventory
      (left-click on a location entry).
  blockprot.debug:
    default: op
    description: >
      Allows running diagnostic checks and viewing debug output via /bp debug.
commands:
  blockprot:
    description: The main blockprot command
    usage: "/blockprot <user|admin>"
    aliases: ["bp"]
softdepend:
  - Towny
  - PlaceholderAPI
  - WorldGuard
  - Lands
  - ClaimChunk
  - ViaVersion
  - ViaBackwards
