# BlockProt Reloaded -- lang.yml
# Language configuration.

fallback_language: translations_en.yml

# true  = enabled (loaded and merged on startup/reload)
# false = disabled (skipped, not parsed)
#
# The active language set in config.yml (language_file) is always
# loaded regardless of this setting, so existing configurations
# are never broken.
languages:
  # Reference languages (actively maintained, always complete)
  translations_en.yml: true
  # K: 0%
  translations_es.yml: true
  # K: 0%

  # Community translations (may have missing keys)
  translations_cs.yml: false
  # K: 0%
  translations_de.yml: false
  # K: 0%
  translations_fr.yml: false
  # K: 0%
  translations_it.yml: false
  # K: 0%
  translations_ja.yml: false
  # K: 0%
  translations_ko.yml: false
  # K: 0%
  translations_pl.yml: false
  # K: 0%
  translations_pt-br.yml: false
  # K: 0%
  translations_ru.yml: false
  # K: 0%
  translations_sk.yml: false
  # K: 0%
  translations_tr.yml: false
  # K: 0%
