# BlockProt Reloaded — blocks.yml
#
# Default format: legacy flat material list (modern_family_blocks: false in config.yml).
#
# ── Family expression syntax ──────────────────────────────────────────────────
#
# Family expressions are always parsed regardless of the modern_family_blocks flag.
# That flag only controls whether flat lists are auto-converted to expressions on startup.
#
# Syntax:
#   [*]                   — all members of the family
#   [*-TAG]               — only the TAG sub-family (e.g. [*-CHEST], [*-SHULKERS])
#   [-*TAG]               — nothing from this family minus TAG sub-family
#                           (no base inclusion = empty result, i.e. disables that sub-family)
#   [* -*TAG]             — all members except the TAG sub-family
#   [* -NAME]             — all members except one specific material
#   [NAME1 NAME2]         — only these specific materials
#
# Sub-families per key:
#   lockable_tile_entities : CHEST, FURNACE, SHELF, TRANSPORT, MISC, SIGN
#   lockable_shulker_boxes : SHULKERS
#   lockable_blocks        : ANVIL, CAULDRON, WORKSTATION, TRAPDOOR, FENCE_GATE
#   lockable_doors         : DOORS
#   auto_drop_to_inventory : uses ALL families — tokens like -*SHULKERS are resolved
#                            against SHULKER_BOXES; [*] expands across all families.
#                            To disable shulker auto-drop entirely, remove their entries
#                            or use an expression that excludes them (e.g. do not include
#                            [*-SHULKERS] in the blocks list).
#
# Examples:
#   lockable_tile_entities:
#     - '[*-FURNACE *-CHEST]'           # only furnaces and chests
#     - '[* -*SIGN]'                    # all tile entities except signs
#
#   auto_drop_to_inventory:
#     enabled: true
#     blocks:
#       - '[*-SHULKERS]'               # shulkers auto-drop to inventory
#       - '[*-SHULKERS -RED_SHULKER_BOX]' # all shulkers except red
#
# To restore these defaults, delete this file and restart the server.
# The plugin will regenerate it from the JAR on next startup.
# ─────────────────────────────────────────────────────────────────────────────

