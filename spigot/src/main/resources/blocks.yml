# lockable_entities — storage vehicles and item frames.
# ALL entity types are DISABLED by default. This list ships empty.
# Add material names or family expressions below to enable protection.
#
# Supported types and their sub-families:
#   ITEM_FRAMES  : ITEM_FRAME, GLOW_ITEM_FRAME
#   CHEST_MINECARTS  : CHEST_MINECART
#   HOPPER_MINECARTS : HOPPER_MINECART
#   CHEST_BOATS      : CHEST_BOAT, OAK_CHEST_BOAT, SPRUCE_CHEST_BOAT,
#                      BIRCH_CHEST_BOAT, JUNGLE_CHEST_BOAT, ACACIA_CHEST_BOAT,
#                      DARK_OAK_CHEST_BOAT, MANGROVE_CHEST_BOAT,
#                      CHERRY_CHEST_BOAT, BAMBOO_CHEST_BOAT
#
# Entity protection is stored in the entity's Persistent Data Container (PDC).
# Protection survives chunk reloads and server restarts but is lost permanently
# when the entity is killed (entity ceases to exist; no block to attach NBT to).
#
# Item frame protection:
#   When ITEM_FRAME or GLOW_ITEM_FRAME is listed here, players can sneak +
#   right-click a frame with an empty hand to open the BlockProt protection menu.
#   Once protected, non-owners cannot rotate, replace, or break the frame.
#   Players with blockprot.user.admin always bypass frame protection.
#   Item frames appear in /bp lockables under the ENTITIES family (INACTIVE by default).
#
# Vehicle protection:
#   Chest minecarts and chest boats with a listed material are protected against
#   player inventory access AND hopper-pipeline extraction.
#   Hopper minecarts are protected against player access; their item-collection
#   behavior from the ground is not affected.
#
# Migration note: existing servers that do not have this key in their blocks.yml
#   will have it patched in automatically (empty list) on next startup.
#   All existing protections are preserved; no data loss occurs.
#
# Enable all entity types:
#   lockable_entities:
#     - '[*]'
#
# Enable only storage vehicles:
#   lockable_entities:
#     - '[*-CHEST_BOATS *-CHEST_MINECARTS *-HOPPER_MINECARTS]'
#
# Enable only item frames:
#   lockable_entities:
#     - '[*-ITEM_FRAMES]'
#
# Enable specific materials only:
#   lockable_entities:
#     - CHEST_MINECART
#     - ITEM_FRAME
#     - GLOW_ITEM_FRAME
lockable_entities: []

# Auto-drop shulker boxes directly to the breaker's inventory on break.
# The 'blocks' list controls WHICH materials trigger auto-drop.
# Uses all family expression syntax. Only shulker-type materials are relevant here
# unless you also want other lockable blocks (chests, etc.) to auto-drop.
#
# To enable auto-drop for all shulkers:
#   blocks:
#     - '[*-SHULKERS]'
#
# To enable for all shulkers except red:
#   blocks:
#     - '[*-SHULKERS -RED_SHULKER_BOX]'
#
# To disable shulker auto-drop entirely:
#   enabled: false
#   (or simply remove all entries from blocks)
auto_drop_to_inventory:
  enabled: true
  blocks:
    - SHULKER_BOX
    - WHITE_SHULKER_BOX
    - ORANGE_SHULKER_BOX
    - MAGENTA_SHULKER_BOX
    - LIGHT_BLUE_SHULKER_BOX
    - YELLOW_SHULKER_BOX
    - LIME_SHULKER_BOX
    - PINK_SHULKER_BOX
    - GRAY_SHULKER_BOX
    - LIGHT_GRAY_SHULKER_BOX
    - CYAN_SHULKER_BOX
    - PURPLE_SHULKER_BOX
    - BLUE_SHULKER_BOX
    - BROWN_SHULKER_BOX
    - GREEN_SHULKER_BOX
    - RED_SHULKER_BOX
    - BLACK_SHULKER_BOX
