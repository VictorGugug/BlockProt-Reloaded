# lockable_entities — chest boats, minecarts, and item frames.
# Item frames (ITEM_FRAME, GLOW_ITEM_FRAME) are virtual — they are entities,
# not blocks, and do not appear as Materials. Protection is handled separately
# by ItemFrameListener using EntityNBTHandler. The entries below control only
# the block-based entity types (minecarts, boats) for /bp lockables display.
#
# To enable chest boat and minecart protection:
#   lockable_entities:
#     - CHEST_MINECART
#     - HOPPER_MINECART
#     - OAK_CHEST_BOAT
#     - '[*-CHEST_BOATS]'      # all chest boat variants
#
# Item frame protection is always active via ItemFrameListener.
# Leave empty or commented out to disable minecart/boat entity protection.
lockable_entities: []

# Auto-drop shulker boxes directly to the breaker's inventory on break.
# The 'blocks' list controls WHICH materials trigger auto-drop.
# Uses all family expression syntax. Only shulker-type materials are relevant here
# unless you also want other lockable blocks (chests, etc.) to auto-drop.
#
# To enable auto-drop for all shulkers:
#   blocks:
#     - '[*-SHULKERS]'
#
# To enable for all shulkers except red:
#   blocks:
#     - '[*-SHULKERS -RED_SHULKER_BOX]'
#
# To disable shulker auto-drop entirely:
#   enabled: false
#   (or simply remove all entries from blocks)
auto_drop_to_inventory:
  enabled: true
  blocks:
    - SHULKER_BOX
    - WHITE_SHULKER_BOX
    - ORANGE_SHULKER_BOX
    - MAGENTA_SHULKER_BOX
    - LIGHT_BLUE_SHULKER_BOX
    - YELLOW_SHULKER_BOX
    - LIME_SHULKER_BOX
    - PINK_SHULKER_BOX
    - GRAY_SHULKER_BOX
    - LIGHT_GRAY_SHULKER_BOX
    - CYAN_SHULKER_BOX
    - PURPLE_SHULKER_BOX
    - BLUE_SHULKER_BOX
    - BROWN_SHULKER_BOX
    - GREEN_SHULKER_BOX
    - RED_SHULKER_BOX
    - BLACK_SHULKER_BOX
